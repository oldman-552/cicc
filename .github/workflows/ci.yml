name: Development checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: alembic -c backend/alembic.ini upgrade head
      - run: alembic -c backend/alembic.ini check
      - run: python -m pytest -q backend/tests
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cicc_test
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: cicc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cicc_test -d cicc_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    env:
      DATABASE_URL: postgresql+psycopg://cicc_test:disposable-ci-only@localhost:5432/cicc_test
      CICC_TEST_POSTGRES_URL: postgresql+psycopg://cicc_test:disposable-ci-only@localhost:5432/cicc_test
      CICC_TEST_DISPOSABLE_DB: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: alembic -c backend/alembic.ini upgrade head
      - run: alembic -c backend/alembic.ini check
      - run: python -m pytest -q backend/tests/test_postgres_integration.py
